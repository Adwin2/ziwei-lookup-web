<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>紫微斗数查表</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><header class="topbar"><div><p class="eyebrow">确定性查表服务</p><h1>紫微斗数查表</h1></div><nav><button id="accountBtn" class="link-button">登录 / 注册</button><a href="#about">数据说明</a></nav></header><div class="workspace"><aside class="query"><h2>出生信息</h2><p class="help">按公历日期与北京时间时辰查找已生成的命盘。</p><form id="form"><label>出生日期<input id="date" type="date" required value="2004-03-15"></label><label>北京时间时辰<select id="hour"><option value="0">子时（0）</option><option value="1">丑时（1）</option><option value="2">寅时（2）</option><option value="3">卯时（3）</option><option value="4">辰时（4）</option><option value="5">巳时（5）</option><option value="6">午时（6）</option><option value="7" selected>未时（7）</option><option value="8">申时（8）</option><option value="9">酉时（9）</option><option value="10">戌时（10）</option><option value="11">亥时（11）</option></select></label><fieldset><legend>性别</legend><label class="radio"><input type="radio" name="gender" value="female" checked>女</label><label class="radio"><input type="radio" name="gender" value="male">男</label></fieldset><button>查询命盘</button></form><p class="note">服务只读取预先生成的数据，不调用 AI，也不在请求时重新排盘。</p></aside><section class="results" aria-live="polite"><div id="accountPanel" class="account-panel" hidden><div class="panel-head"><h2>我的资料</h2><button id="closeAccount" class="close">关闭</button></div><div id="authView"><div class="tabs"><button class="tab active" data-mode="login">登录</button><button class="tab" data-mode="register">注册</button></div><form id="authForm"><label>邮箱<input id="authEmail" type="email" autocomplete="email" required></label><label id="nameField" hidden>显示名称<input id="authName" maxlength="40" autocomplete="name"></label><label>密码<input id="authPassword" type="password" minlength="8" autocomplete="current-password" required></label><button id="authSubmit">登录</button></form><p id="authError" class="error-text"></p></div><div id="userView" hidden><p id="welcome" class="muted"></p><form id="profileForm" class="profile-form"><h3>保存出生资料</h3><label>资料名称<input id="profileLabel" placeholder="例如：我的命盘" maxlength="40" required></label><button>保存当前信息</button></form><div><h3>已保存资料</h3><div id="profiles"></div></div><div><h3>最近查询</h3><div id="history"></div></div><button id="logout" class="secondary">退出登录</button></div></div><div id="empty" class="empty"><h2>输入出生信息后开始查询</h2><p>结果会在此处显示十二宫与对应解读。</p></div><div id="loading" class="empty" hidden>正在读取命盘数据……</div><div id="error" class="empty error" hidden></div><div id="chart" hidden></div></section></div><footer id="about">命盘数据与解读内容来源：<a href="https://github.com/Renhuai123/ziwei-doushu" target="_blank" rel="noreferrer">Renhuai123/ziwei-doushu</a> v4.0，作者：王多鱼AI，遵循 CC BY 4.0。</footer></main><script src="/static/app.js"></script></body></html>
